# Développement local. En production, l'hébergeur fournit PHP et la base ;
# seules les variables d'environnement changent.
services:
  # MariaDB en local comme en production : un schéma qui marche sur un moteur
  # et casse sur l'autre se découvre au pire moment, le jour de la mise en ligne.
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: gpv
      MARIADB_USER: gpv
      MARIADB_PASSWORD: gpv
      MARIADB_ROOT_PASSWORD: gpv
    ports:
      - '3306:3306'
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: php:8.3-cli
    working_dir: /app
    command: >
      sh -c "docker-php-ext-install pdo_mysql >/dev/null 2>&1 || true; php -S 0.0.0.0:8000 -t public"
    environment:
      APP_ENV: dev
      DATABASE_URL: 'mysql://gpv:gpv@database:3306/gpv?serverVersion=11.4.2-MariaDB&charset=utf8mb4'
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: 'http://backend:8000'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules

volumes:
  database_data:
  frontend_modules:
