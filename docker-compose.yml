# Développement local. En production, l'hébergeur fournit PHP et PostgreSQL ;
# seules les variables d'environnement changent.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpv
      POSTGRES_USER: gpv
      POSTGRES_PASSWORD: gpv
    ports:
      - '5432:5432'
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gpv -d gpv']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: php:8.3-cli
    working_dir: /app
    command: >
      sh -c "php -S 0.0.0.0:8000 -t public"
    environment:
      APP_ENV: dev
      DATABASE_URL: 'postgresql://gpv:gpv@database:5432/gpv?serverVersion=16&charset=utf8'
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: 'http://backend:8000'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules

volumes:
  database_data:
  frontend_modules:
