# Déploiement sur Platform.sh. Scalingo et Clever Cloud suivent le même principe :
# construire le front, servir backend/public, injecter DATABASE_URL.
name: gpv
type: 'php:8.3'

dependencies:
  php:
    composer/composer: '^2'
  nodejs:
    npm: '^10'

runtime:
  extensions:
    - pdo_pgsql
    - sodium
    - intl
    - apcu

variables:
  env:
    APP_ENV: prod

build:
  flavor: none

web:
  locations:
    '/api':
      root: 'backend/public'
      passthru: '/index.php'
      allow: false
    '/':
      root: 'frontend/dist'
      index: ['index.html']
      allow: true
      # Une application React gère ses propres routes : toute URL inconnue
      # rend index.html, sinon un rechargement sur /domaines/... renverrait 404.
      rules:
        '^/(?!api).*$':
          allow: true
          passthru: '/index.html'

disk: 2048

mounts:
  '/backend/var':
    source: local
    source_path: var

relationships:
  database: 'db:postgresql'

hooks:
  build: |
    set -e
    cd backend && composer install --no-dev --optimize-autoloader --no-interaction
    cd ../frontend && npm ci && npm run build
  deploy: |
    set -e
    cd backend
    php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
    php bin/console cache:clear

crons:
  purge-expired:
    spec: '0 4 * * *'
    commands:
      start: 'cd backend && php bin/console app:purge-expired'
