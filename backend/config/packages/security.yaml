security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Délivre un couple jeton JWT + jeton de rafraîchissement (mobile, bureau).
        token:
            pattern: ^/api/auth/token$
            stateless: true
            security: false

        # Le web : cookie de session. Le mobile et le bureau : en-tête Authorization.
        api:
            pattern: ^/api
            provider: app_users
            stateless: false
            context: gpv
            entry_point: App\Security\ApiEntryPoint
            # Pas de `json_login` : le mot de passe seul ne doit ouvrir aucune
            # session. La connexion se fait en deux temps dans AuthController,
            # et la session n'est posée qu'après le code à usage unique.
            jwt: ~
            logout:
                path: api_auth_logout
                invalidate_session: true

    access_control:
        - { path: '^/api/auth/(register|verify|login|login/verify|token|token/verify|refresh|code/resend|password/forgot|password/reset)', roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: plaintext
                cost: 4
